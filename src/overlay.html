<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    background: transparent;
    overflow: hidden;
    height: 100%;
    width: 100%;
    user-select: none;
    -webkit-user-select: none;
}
canvas { display: block; }
</style>
</head>
<body>
<canvas id="overlay"></canvas>

<script>
const invoke = window.__TAURI__.core.invoke;
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');

// Match canvas to window size
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let config = null;
let lastConfigStr = '';
let lastStats = null;

const FMT = {
    cpu:       (s) => `CPU ${s.cpu_percent.toFixed(0)}%`,
    cpu_freq:  (s) => s.cpu_freq_ghz > 0 ? `${s.cpu_freq_ghz.toFixed(2)}GHz` : null,
    ram:       (s) => `RAM ${s.ram_percent.toFixed(0)}%`,
    ram_gb:    (s) => `${s.ram_used_gb.toFixed(1)}/${s.ram_total_gb.toFixed(1)}GB`,
    gpu:       (s) => s.gpu_percent != null ? `GPU ${s.gpu_percent}%` : 'GPU N/A',
    gpu_temp:  (s) => s.gpu_temp != null ? `${s.gpu_temp}°C` : null,
    gpu_power: (s) => s.gpu_power_w != null ? `${s.gpu_power_w}W` : null,
    gpu_clock: (s) => s.gpu_clock_mhz != null ? `${s.gpu_clock_mhz}MHz` : null,
    vram:      (s) => s.vram_used_mb != null ? `VRAM ${s.vram_used_mb}MB` : null,
    disk_io:   (s) => `Disk ${Math.max(s.disk_read_mb, s.disk_write_mb).toFixed(0)}MB/s`,
    net_io:    (s) => `Net D:${s.net_down_mb.toFixed(1)} U:${s.net_up_mb.toFixed(1)}MB/s`,
};

function draw() {
    if (!config || !lastStats) return;

    const order = config.metrics_order || Object.keys(FMT);
    const parts = [];
    for (const key of order) {
        if (!config.metrics[key]) continue;
        const fn = FMT[key];
        if (!fn) continue;
        const v = fn(lastStats);
        if (v != null) parts.push(v);
    }
    const text = parts.length > 0 ? parts.join('  |  ') : 'No metrics selected';

    const fontSize = config.appearance.font_size || 9;
    const fontFamily = config.appearance.font_family || 'Arial';
    const color = config.appearance.text_color || '#CCCCCC';

    // === Conky approach: clear everything, then redraw ===
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.font = `${fontSize}pt ${fontFamily}`;
    ctx.fillStyle = color;
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;
    ctx.fillText(text, 5, canvas.height / 2 + fontSize / 2);
}

async function pollConfig() {
    try {
        const cfg = await invoke('get_config');
        const str = JSON.stringify(cfg);
        if (str !== lastConfigStr) {
            lastConfigStr = str;
            config = cfg;
            draw();
        }
    } catch (e) {}
}

async function pollStats() {
    try {
        lastStats = await invoke('get_stats');
        draw();
    } catch (e) {}
}

(async () => {
    await pollConfig();
    await pollStats();
    setInterval(pollConfig, 100);
    setInterval(pollStats, 1000);
})();
</script>
</body>
</html>
